<html lang="uz">
<head>

<title>356-maktab · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: chap tomonda doska-yashil yon panel, o'ngda katak qog'oz ustidagi ish maydoni */
:root{
  --paper:#eaf1e6; --paper-2:#dfe9d9; --grid:rgba(31,59,45,.06);
  --ink:#13241a; --ink-soft:#4a5d50; --card:#fcfdf9; --line:#cfdcc8;
  --board:#1f3b2d; --board-2:#2a4c3a; --chalk:#f4f1e6; --marigold:#f0b429; --margin:#d4483f;
  --ok:#2f7a52; --shadow:0 1px 0 rgba(19,36,26,.04),0 10px 28px -12px rgba(31,59,45,.25);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121b16; --paper-2:#18241d; --grid:rgba(244,241,230,.04); --ink:#ecefe6; --ink-soft:#a9b5ab;
  --card:#1a271f; --line:#2b3b31; --board:#0d1a13; --board-2:#183126; --margin:#e0625a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121b16; --paper-2:#18241d; --grid:rgba(244,241,230,.04); --ink:#ecefe6; --ink-soft:#a9b5ab;
  --card:#1a271f; --line:#2b3b31; --board:#0d1a13; --board-2:#183126; --margin:#e0625a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:15px/1.55 var(--f-body)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
aside.side{background:var(--board);color:var(--chalk);padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px}
.stamp{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--marigold);color:var(--marigold);display:grid;place-items:center;font:900 14px var(--f-display);transform:rotate(-8deg);flex:none}
.brand b{font-family:var(--f-display);font-size:14px;display:block}
.brand small{font-family:var(--f-hand);font-size:19px;color:var(--marigold)}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;color:rgba(244,241,230,.75);cursor:pointer;font-weight:500}
.nav-btn:hover{background:rgba(244,241,230,.07);color:var(--chalk)}
.nav-btn.on{background:var(--chalk);color:var(--board)}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn .badge{margin-left:auto;background:var(--margin);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.side .sep{flex:1}
.side a.site{color:var(--marigold);text-decoration:none;font-weight:600;padding:10px 12px;border:1.5px dashed rgba(244,241,230,.3);border-radius:10px;text-align:center}

main{padding:28px max(16px,env(safe-area-inset-right,0px)) 60px 28px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px}
.head .hand{font-family:var(--f-hand);font-size:24px;color:var(--margin)}
.head h1{font-size:clamp(24px,3.4vw,34px)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.pri{background:var(--board);color:var(--chalk);border-color:var(--board)}
.btn.yel{background:var(--marigold);color:#1d1a0e;border-color:var(--marigold)}
.btn.danger{color:var(--margin);border-color:color-mix(in srgb,var(--margin) 40%,var(--line))}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi b{font:700 32px var(--f-display);display:block;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink-soft);font-size:13.5px}
.kpi.alert b{color:var(--margin)}
@media (max-width:1000px){.cards{grid-template-columns:1fr 1fr}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.panel h3{font-size:15px;padding:16px 18px;border-bottom:1px dashed var(--line)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.quick button{padding:16px;border-radius:12px;border:1.5px dashed var(--line);background:var(--paper);cursor:pointer;text-align:left;font-weight:600}
.quick button small{display:block;font-weight:400;color:var(--ink-soft);font-size:12.5px}
.quick button:hover{border-color:var(--marigold)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar input{flex:1;min-width:200px}
input,select,textarea{font:inherit;font-size:14.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:84px}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px dashed var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
td .t{font-weight:600}
td .sub{color:var(--ink-soft);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);white-space:nowrap}
.pill.m1{background:#f7e3a6;color:#5b4300}.pill.m2{background:#dfe3e5;color:#3b4348}.pill.m3{background:#efcfb4;color:#5c3214}
.pill.soon{background:color-mix(in srgb,var(--margin) 18%,var(--card));color:var(--margin)}
.thumb{width:52px;height:38px;border-radius:8px;background:var(--paper-2) center/cover;flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.empty .hand{font-family:var(--f-hand);font-size:26px;color:var(--ink);display:block}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:16px}
.gi{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.gi .img{aspect-ratio:4/3;background:var(--paper-2) center/cover;max-width:100%}
.gi div.f{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}

/* drawer form */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,18,13,.5);display:flex;justify-content:flex-end}
.dbox{background:var(--card);width:min(640px,100%);height:100%;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:16px}
.dbox .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dbox h2{font-size:20px}
.field{display:grid;gap:6px}
.field>label{font-size:13.5px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--ink-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:2fr 1fr 1fr 2fr;gap:8px;align-items:center}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
fieldset{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;margin:0}
legend{font:600 13px var(--f-display);padding:0 6px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.check input{width:auto}
.upl{display:flex;gap:12px;align-items:center}
.upl .prev{width:110px;height:76px;border-radius:10px;background:var(--paper-2) center/cover;border:1px dashed var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:var(--ink-soft)}
.medals{display:flex;gap:8px}
.medals label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-weight:600;font-size:14px}
.medals input{display:none}
.medals input:checked+span{color:var(--ink)}
.medals label:has(input:checked){border-color:var(--marigold);background:color-mix(in srgb,var(--marigold) 15%,var(--card))}
.dfoot{display:flex;gap:10px;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
.err{color:var(--margin);font-size:14px;font-weight:600}

.msg{padding:16px 18px;border-bottom:1px dashed var(--line);display:grid;gap:4px}
.msg.new{background:color-mix(in srgb,var(--marigold) 10%,var(--card))}
.msg .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft)}
.msg .meta b{color:var(--ink);font-size:14.5px}
.msg p{margin:4px 0 6px;white-space:pre-wrap}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--board);color:var(--chalk);padding:12px 20px;border-radius:999px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;max-width:440px;text-align:center;box-shadow:var(--shadow)}
.gate .hand{font-family:var(--f-hand);font-size:28px;color:var(--margin)}
.rows{display:grid;gap:10px}
.rrow{display:grid;gap:8px;align-items:start;border:1px dashed var(--line);border-radius:12px;padding:12px;background:var(--paper)}
.rrow.tl{grid-template-columns:170px 1fr auto}
.rrow.res{grid-template-columns:140px 110px 1fr auto}
.rrow.res textarea{grid-column:1/-2;min-height:60px}
.rrow .x{align-self:start}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vals .rrow{grid-template-columns:1fr}
@media (max-width:640px){.rrow.tl,.rrow.res{grid-template-columns:1fr}.rrow.res textarea{grid-column:auto}.vals,.row3{grid-template-columns:1fr}}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.acts{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
td.act .acts{flex-wrap:nowrap}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));z-index:20;gap:4px}
  .brand,.side .sep{display:none}
  .nav-btn{white-space:nowrap;width:auto}
  .side a.site{white-space:nowrap;padding:8px 12px}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) 50px max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="box" id="loginForm" style="display:grid;gap:14px;text-align:left">
    <div style="display:flex;gap:14px;align-items:center"><span class="stamp" style="border-color:var(--margin);color:var(--margin)">356</span><div><div class="hand" style="font-size:24px">xush kelibsiz</div><h2 style="font-size:20px">Admin panelga kirish</h2></div></div>

<script>
const ICON={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5"/>',
 medal:'<circle cx="12" cy="15" r="5"/><path d="M8 3l2 7M16 3l-2 7M9 3h6"/>',
 teach:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const fmt=s=>{if(!s)return"—";const d=new Date(s);return isNaN(d)?s:d.getDate()+"-"+MON[d.getMonth()]+", "+d.getFullYear()};
const today=()=>new Date().toISOString().slice(0,10);
const CAT={tadbir:"Tadbir",olimpiada:"Olimpiada",sport:"Sport",elon:"E'lon"};
const FANLAR=["Matematika","Fizika","Kimyo","Biologiya","Ingliz tili","Rus tili","Ona tili","Tarix","Informatika","Sport","San'at","Boshqa"];
const LEVELS=["Tuman","Shahar","Respublika","Xalqaro"];

let assets=true;
async function api(method,url,body){
  const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  let d={};try{d=await r.json()}catch(_){}
  if(r.status===401&&url!=="/api/login"){showLogin("Sessiya tugadi, qayta kiring.");}
  if(!r.ok)throw{code:r.status,message:d.error||"Xatolik"};
  return d;
}
// Rasmni yuklashdan oldin kichraytirib, JPG ga aylantiradi (telefon rasmlari 5-15 MB bo'ladi)
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no({code:400,message:"Bu rasmni ochib bo'lmadi. JPG yoki PNG formatdagi rasm tanlang."});img.src=url});
    const MAX=1600,k=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    return c.toDataURL("image/jpeg",0.85);
  }finally{URL.revokeObjectURL(url)}
}
async function upload(file){
  if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|gif|heic|heif|bmp)$/i.test(file.name))throw{code:400,message:"Faqat rasm faylini tanlang (JPG, PNG)."};
  const data=await shrink(file);
  return api("POST","/api/upload",{data});
}
async function load(){const d=await api("GET","/api/admin/all");["news","achievements","teachers","events","gallery"].forEach(k=>S[k]=d[k]||[]);S.inbox=d.messages||[];S.settings=d.settings||{};
  if($("#drawer").hidden&&view!=="settings"&&view!=="director"&&view!=="about")render();else renderNav()}
const S={news:[],achievements:[],teachers:[],events:[],gallery:[],inbox:[],settings:{}};
let view="home",search="";

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- text <-> structure helpers ---------- */
const pairsToText=a=>(a||[]).map(([k,v])=>k+": "+v).join("\n");
const textToPairs=t=>t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(":");return i<0?[l,""]:[l.slice(0,i).trim(),l.slice(i+1).trim()]});
const listsToText=a=>(a||[]).map(s=>"## "+s.h+"\n"+s.items.map(i=>"- "+i).join("\n")).join("\n\n");
function textToLists(t){const out=[];let cur=null;t.split("\n").forEach(l=>{l=l.trim();if(!l)return;if(l.startsWith("##")){cur={h:l.replace(/^#+\s*/,""),items:[]};out.push(cur)}else{if(!cur){cur={h:"Ma'lumot",items:[]};out.push(cur)}cur.items.push(l.replace(/^[-•*]\s*/,""))}});return out}
const rosterToText=a=>(a||[]).map(r=>r.join(" | ")).join("\n");
const textToRoster=t=>t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return[p[0]||"",p[1]||"",p[2]||""]});
const peopleToText=a=>(a||[]).map(p=>[p.n,p.r,(p.certs||[]).join("; ")].join(" | ")).join("\n");
const textToPeople=t=>t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return{n:p[0]||"",r:p[1]||"",certs:(p[2]||"").split(";").map(x=>x.trim()).filter(Boolean)}});

const titleCase=s=>s.replace(/\s+/g," ").split(" ").map(w=>w?w[0].toLocaleUpperCase("uz")+w.slice(1):w).join(" ");
const compName=(comp,f)=>comp==="Fan olimpiadasi"?f.toLowerCase()+" olimpiadasi":comp==="Sport musobaqasi"?f==="Sport"?"sport musobaqasi":f.toLowerCase()+" musobaqasi":comp.toLowerCase();
function achNews(doc){
  const win=doc.m===1?"g'olibi":"sovrindori",lv=doc.lv.toLowerCase(),cn=compName(doc.comp||"Fan olimpiadasi",doc.f);
  const info=[["O'quvchi",doc.n],["Sinf",doc.cl],["Yo'nalish",doc.f],["Musobaqa",`${doc.lv} ${cn}`],["Natija",doc.m+"-o'rin"]];
  if(doc.place)info.push(["Qayerda o'tdi",doc.place]);
  return{t:`${doc.n} — ${lv} ${cn} ${win}`,c:"olimpiada",d:today(),g:doc.m+"-o'rin",medal:doc.m,who:doc.n,
   s:`${doc.cl} sinf o'quvchisi ${doc.n} ${lv} ${cn}da ${doc.m}-o'rinni egalladi${doc.place?` (${doc.place})`:""}.`,
   full:`Tabriklaymiz! ${doc.cl} sinf o'quvchisi ${doc.n} ${doc.y}-yilda bo'lib o'tgan ${lv} ${cn}da ishtirok etib, faxrli ${doc.m}-o'rinni qo'lga kiritdi${doc.place?`. Musobaqa ${doc.place}da o'tkazildi`:""}. Bu natija o'quvchining tinimsiz mehnati va ustozlarining fidoyiligi samarasidir. Maktabimiz jamoasi ${doc.n}ni va uning ustozlarini chin qalbdan qutlaydi!`,
   soon:false,img:doc.photo||null,more:{info}};
}

/* ---------- collection configs ---------- */
const CFG={
 news:{title:"Yangiliklar",one:"yangilik",hand:"maktab hayoti",icon:"news",

function imgField(id,label,val){
  if(!assets)return`<div class="field"><label>${label}</label><span class="hint">Rasm yuklash mavjud emas.</span><input type="hidden" id="${id}" data-id="${esc(val||"")}"></div>`;
  return`<div class="field"><label for="${id}_file">${label}</label><div class="upl"><span class="prev" id="${id}_prev" style="${val?`background-image:url('/uploads/${val}')`:""}">${val?"":"Rasm yo'q"}</span>
  <div style="display:grid;gap:6px"><input type="file" id="${id}_file" accept="image/*" style="padding:8px"><input type="hidden" id="${id}" data-id="${esc(val||"")}">
  <span class="hint" id="${id}_st">JPG yoki PNG. Katta rasm o\'zi kichraytiriladi</span>${val?`<button type="button" class="btn sm" data-clear="${id}">Rasmni olib tashlash</button>`:""}</div></div></div>`;
}
function wireImg(scope){
  scope=scope||'#dbox';
  document.querySelectorAll(scope+' input[type=file]').forEach(inp=>{
    const id=inp.id.replace(/_file$/,"");
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const st=$("#"+id+"_st");st.textContent="Yuklanmoqda...";inp.disabled=true;$("#dSave")&&($("#dSave").disabled=true);
      try{const r=await upload(f);$("#"+id).dataset.id=r.id;const p=$("#"+id+"_prev");p.style.backgroundImage=`url('${r.url}')`;p.textContent="";st.textContent="Rasm yuklandi"}
      catch(e){st.textContent=e.message||"Yuklab bo'lmadi, qayta urinib ko'ring"}
      finally{inp.disabled=false;$("#dSave")&&($("#dSave").disabled=false)}};
  });
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const id=b.dataset.clear;$("#"+id).dataset.id="";const p=$("#"+id+"_prev");p.style.backgroundImage="";p.textContent="Rasm yo'q";b.remove()});
}

/* ---------- drawer ---------- */
function openForm(col,item){
  const c=CFG[col],x=item||{};
  $("#dbox").innerHTML=`<div class="top"><h2>${item?"O'zgartirish":"Yangi "+c.one}</h2><button class="btn sm" id="dClose">Yopish ✕</button></div>
   <form id="dForm" style="display:grid;gap:16px">${c.form(x)}
   <div class="err" id="dErr" hidden></div>
   <div class="dfoot"><button class="btn pri" type="submit" id="dSave">${item?"✓ Tayyor":"Qo'shish"}</button>
   ${item?`<span class="confirm" id="delWrap"><button type="button" class="btn danger" id="dDel">O'chirish</button></span>`:""}</div></form>`;
  $("#drawer").hidden=false;wireImg();
  setTimeout(()=>$("#dbox input:not([type=hidden]),#dbox select")?.focus(),30);
  $("#dClose").onclick=closeForm;
  $("#dForm").onsubmit=async e=>{e.preventDefault();const doc=c.pack();const bad=c.validate?.(doc);if(bad){showErr(bad);return}
    $("#dSave").disabled=true;$("#dSave").textContent="Saqlanmoqda...";
    try{ const saved=item?await api("PUT",`/api/${col}/${item.id}`,doc):await api("POST",`/api/${col}`,doc);
      await c.after?.(doc,saved);closeForm();await load();toast(item?"O'zgartirildi — saytda yangilandi":"Qo'shildi — saytda paydo bo'ldi");}
    catch(err){$("#dSave").disabled=false;$("#dSave").textContent=item?"✓ Tayyor":"Qo'shish";showErr(err.code===401?"Sessiya tugadi, qayta kiring.":err.code?err.message:"Server bilan aloqa yo'q. Server ishlayotganini tekshiring.")}};
  if(item)$("#dDel").onclick=()=>{$("#delWrap").innerHTML=`Rostdan o'chirilsinmi? <button type="button" class="btn sm danger" id="dYes">Ha, o'chirish</button><button type="button" class="btn sm" id="dNo">Yo'q</button>`;
    $("#dNo").onclick=()=>openForm(col,item);
    $("#dYes").onclick=async()=>{try{await api("DELETE",`/api/${col}/${item.id}`);closeForm();await load();toast("O'chirildi")}catch(e){showErr("O'chirib bo'lmadi, qayta urinib ko'ring.")}}};
}
function showErr(t){const e=$("#dErr");e.textContent=t;e.hidden=false}
function closeForm(){$("#drawer").hidden=true}
$("#drawer").addEventListener("click",e=>{if(e.target.id==="drawer")closeForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeForm()});

  const u=unread();
  $("#nav").innerHTML=items.map(([k,t,i])=>`<button class="nav-btn ${view===k?"on":""}" data-v="${k}">${svg(i)}${t}${k==="inbox"&&u?`<span class="badge">${u}</span>`:""}</button>`).join("");
}

function render(){
  renderNav();
  const m=$("#main");
  if(view==="home")return m.innerHTML=homeView();
  if(view==="inbox")return m.innerHTML=inboxView();
  if(view==="settings"){m.innerHTML=settingsView();return wireSettings()}
  if(view==="about"){m.innerHTML=aboutView();return wireAbout()}
  if(view==="director"){m.innerHTML=directorView();wireImg("#main");return wireDirector()}
  const c=CFG[view];let list=[...S[view]].reverse().sort(c.sort);
  if(search)list=list.filter(x=>c.match(x,search.toLowerCase()));
  const addBtn=`<button class="btn yel" data-add="${view}">+ Yangi ${c.one} qo'shish</button>`;
  let body;
  if(!S[view].length)body=`<div class="empty"><span class="hand">Hozircha bo'sh</span>Birinchi ${c.one}ni qo'shish uchun yuqoridagi tugmani bosing.</div>`;
  else if(!list.length)body=`<div class="empty">"${esc(search)}" bo'yicha hech narsa topilmadi.</div>`;
  else if(view==="gallery")body=`<div class="gal">${list.map(x=>`<div class="gi"><div class="img" style="${x.img?`background-image:url('/uploads/${x.img}')`:`background:${x.c||"var(--board)"}`}"></div><div class="f"><span>${esc(x.t)}</span></div><div style="padding:0 12px 12px">${acts(x.id)}</div></div>`).join("")}</div>`;
  else body=`<div class="table"><table><thead><tr>${c.cols.map(h=>`<th>${h}</th>`).join("")}<th></th></tr></thead><tbody>${list.map(x=>`<tr>${c.row(x)}<td class="act">${acts(x.id)}</td></tr>`).join("")}</tbody></table></div>`;
  m.innerHTML=head(c.hand,c.title,addBtn)+`<div class="toolbar"><input id="q" type="search" placeholder="Qidirish..." value="${esc(search)}" aria-label="Qidirish"><span class="pill" style="align-self:center">${S[view].length} ta</span></div><div class="panel">${body}</div>`;
  const q=$("#q");q.oninput=()=>{search=q.value;const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
}
$("#main").addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a)return openForm(a.dataset.add);
  const del=e.target.closest("[data-del]");if(del){const box=del.closest(".acts");const id=del.dataset.del;
    box.innerHTML=`<span class="confirm">${view==="achievements"?"Yutuq va u haqidagi yangilik o'chirilsinmi?":"O'chirilsinmi?"} <button class="btn sm danger" data-yes="${id}">Ha, o'chirish</button><button class="btn sm" data-no="1">Yo'q</button></span>`;return}
  const yes=e.target.closest("[data-yes]");if(yes){const id=yes.dataset.yes;yes.disabled=true;api("DELETE",`/api/${view}/${id}`).then(load).then(()=>toast("O'chirildi — saytdan ham olib tashlandi")).catch(()=>{toast("O'chirib bo'lmadi");render()});return}
  if(e.target.closest("[data-no]"))return render();
  const ed=e.target.closest("[data-edit]");if(ed)return openForm(view,S[view].find(x=>x.id===ed.dataset.edit));
  const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go);
  const qa=e.target.closest("[data-quick]");if(qa){go(qa.dataset.quick);return openForm(qa.dataset.quick)}
  const rd=e.target.closest("[data-read]");if(rd)return markMsg(rd.dataset.read,+rd.dataset.i,"read");
  const dl=e.target.closest("[data-mdel]");if(dl)return markMsg(dl.dataset.mdel,+dl.dataset.i,"del");
});

function inboxView(){
  const all=S.inbox.map(m=>({...m,doc:m.id,i:0}));
  all.sort((a,b)=>(b.at||"").localeCompare(a.at||""));
  return head("saytdan kelgan","Xabarlar")+`<div class="panel">${all.length?all.map(m=>`<div class="msg ${m.read?"":"new"}"><div class="meta"><b>${esc(m.name)}</b><span class="pill">${esc(m.who)}</span><span>${m.at?new Date(m.at).toLocaleString("uz-UZ"):""}</span></div><p>${esc(m.text)}</p><div style="display:flex;gap:8px">${m.read?"":`<button class="btn sm" data-read="${m.doc}" data-i="${m.i}">O'qildi deb belgilash</button>`}<button class="btn sm danger" data-mdel="${m.doc}" data-i="${m.i}">O'chirish</button></div></div>`).join(""):`<div class="empty"><span class="hand">Xabarlar yo'q</span>Saytdagi "Aloqa" formasi orqali yuborilgan xabarlar shu yerda ko'rinadi.</div>`}</div>`;
}
async function markMsg(id,i,act){

function wireAbout(){
  const f=$("#abForm");
  f.addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b)b.closest(".rrow").remove()});
  $("#addRes").onclick=()=>{$("#resRows").insertAdjacentHTML("beforeend",resRow({}));$("#resRows .rrow:last-child .rb").focus()};
  $("#addTl").onclick=()=>{$("#tlRows").insertAdjacentHTML("beforeend",tlRow({}));$("#tlRows .rrow:last-child .ty").focus()};
  f.onsubmit=async e=>{e.preventDefault();const v=id=>$("#"+id).value.trim(),q=(r,c)=>r.querySelector(c).value.trim();
    const about={text:$("#ab_text").value.trim(),
      values:[...f.querySelectorAll(".vals .rrow")].map(r=>({t:q(r,".vt"),d:q(r,".vd")})),
      resTitle:v("ab_rt"),resSub:v("ab_rs"),
      olymp:{tuman:+v("ab_o1")||0,shahar:+v("ab_o2")||0,resp:+v("ab_o3")||0},
      results:[...f.querySelectorAll("#resRows .rrow")].map(r=>({big:q(r,".rb"),unit:q(r,".ru"),title:q(r,".rt"),text:q(r,".rx")})).filter(r=>r.big||r.title),
      timeline:[...f.querySelectorAll("#tlRows .rrow")].map(r=>({y:q(r,".ty"),p:q(r,".tp")})).filter(t=>t.y||t.p)};
    const data={...S.settings,about};
    try{await api("PUT","/api/settings",data);S.settings=data;toast("Saqlandi — saytda yangilandi")}catch(err){toast("Saqlab bo'lmadi")}};
}

/* ---------- kirish va ishga tushirish ---------- */
let poll=null;
function showLogin(msg){
  clearInterval(poll);$("#app").hidden=true;$("#gate").hidden=false;closeForm();
  if(msg){$("#lErr").textContent=msg;$("#lErr").hidden=false}
  setTimeout(()=>$("#lPass").focus(),30);
}
async function enter(){
  $("#gate").hidden=true;$("#app").hidden=false;view="home";
  try{await load()}catch(_){}
  clearInterval(poll);poll=setInterval(()=>load().catch(()=>{}),30000);
}
$("#loginForm").onsubmit=async e=>{e.preventDefault();const b=$("#lBtn");b.disabled=true;$("#lErr").hidden=true;
  try{await api("POST","/api/login",{password:$("#lPass").value});$("#lPass").value="";await enter()}
  catch(err){$("#lErr").textContent=err.code?err.message:"Server bilan aloqa yo'q. Server ishlayotganini tekshiring.";$("#lErr").hidden=false}
  b.disabled=false};
$("#logout").onclick=async()=>{try{await api("POST","/api/logout")}catch(_){}showLogin()};
(async()=>{try{const me=await api("GET","/api/me");if(me.admin)return enter()}catch(_){}showLogin()})();
</script>
